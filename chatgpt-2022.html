<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>30 novembre 2022 · ChatGPT — The AI Era</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root { --accent: #41b7ff; --accent-soft: #8fd2ff; --green: #10a37f; --ink: #02040b; --muted: #9fb0c6; --ease: cubic-bezier(0.16,1,0.3,1); }
    html, body { background: var(--ink) !important; overflow: hidden; height: 100%; margin: 0; }
    body { font-family: inherit; color: #fff; }
    .stage { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }

    /* ---------- Sam Altman, a sinistra, che sfuma nel buio ---------- */
    .photo {
      position: absolute; left: 0; top: 0; bottom: 0; width: 44vw;
      background: url('img/sam-altman.jpg') no-repeat 30% 20% / cover;
      -webkit-mask-image: linear-gradient(90deg, #000 42%, rgba(0,0,0,0.55) 70%, transparent 100%);
              mask-image: linear-gradient(90deg, #000 42%, rgba(0,0,0,0.55) 70%, transparent 100%);
      animation: photoIn 1.6s var(--ease) both;
    }
    .photo::after {
      content: ''; position: absolute; inset: 0;
      background:
        linear-gradient(0deg, var(--ink) 0%, rgba(2,4,11,0) 28%),
        radial-gradient(80% 60% at 30% 35%, rgba(16,163,127,0.10), transparent 70%);
    }
    @keyframes photoIn { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }
    .who {
      position: absolute; left: 3vw; bottom: 5.5vh; z-index: 2;
      font-size: clamp(12px, 1vw, 17px); font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255,255,255,0.75); animation: rise 1s 1.2s var(--ease) both;
    }
    .who b { display: block; margin-top: 4px; font-size: 1.7em; letter-spacing: 0.04em; text-transform: none; color: #fff; }
    .glow { position: absolute; right: -10vw; top: -20vh; width: 70vw; height: 80vh; pointer-events: none; filter: blur(60px);
      background: radial-gradient(closest-side, rgba(16,163,127,0.16), transparent); }

    /* ---------- Testo a destra ---------- */
    .copy { position: absolute; z-index: 3; left: 44vw; right: 6vw; top: 50%; transform: translateY(-50%); }
    /* data e nome alla stessa misura: due righe di titolo */
    .date, .title { margin: 0; line-height: 1; font-size: clamp(42px, 5.1vw, 104px); font-weight: 900; letter-spacing: -0.035em; white-space: nowrap; }
    .date {
      background: linear-gradient(180deg, #fff 35%, #8fd2ff 100%); -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: rise 1s 0.3s var(--ease) both;
    }
    .title { margin-top: 0.06em; }
    .title .ch { display: inline-block; animation: chIn 0.9s var(--ease) both;
      background: linear-gradient(180deg, #fff 35%, #9ff0d6 100%); -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent; }
    @keyframes chIn { from { opacity: 0; transform: translateY(0.3em); filter: blur(12px); } to { opacity: 1; transform: none; filter: blur(0); } }
    .sub { margin: clamp(10px, 1.6vh, 18px) 0 0; font-size: clamp(19px, 1.8vw, 34px); font-weight: 300; color: #dbe6f3; line-height: 1.3;
      animation: rise 1s 1.1s var(--ease) both; }
    .sub b { font-weight: 700; color: #fff; }

    .zeros { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(14px, 1.6vw, 28px); margin-top: clamp(22px, 4vh, 46px); }
    .zero {
      position: relative; padding: clamp(16px, 2.4vh, 26px) clamp(16px, 1.5vw, 26px); border-radius: 18px;
      background: linear-gradient(160deg, rgba(16,163,127,0.12), rgba(65,183,255,0.04)); border: 1px solid rgba(143,210,255,0.18);
      animation: rise 1s var(--ease) both;
    }
    .zero.z1 { animation-delay: 1.6s; } .zero.z2 { animation-delay: 2.2s; }
    .zero .k { font-size: clamp(11px, 0.9vw, 15px); font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-soft); }
    .zero .v { display: flex; align-items: baseline; gap: 0.25em; margin: 6px 0 8px; font-size: clamp(44px, 4.6vw, 88px); font-weight: 900; line-height: 1; letter-spacing: -0.04em; }
    .zero .v small { font-size: 0.32em; font-weight: 700; letter-spacing: 0; color: var(--muted); }
    .zero .v .arrow { font-size: 0.42em; color: var(--green); font-weight: 800; }
    .zero p { margin: 0; font-size: clamp(14px, 1.15vw, 21px); line-height: 1.4; color: #c9d7e8; }
    .zero p b { color: #fff; font-weight: 700; }

    /* mini grafico: la curva di apprendimento che sparisce */
    .curve { display: block; width: 100%; height: clamp(54px, 8vh, 90px); margin-top: 10px; overflow: visible; }
    .curve .old { fill: none; stroke: rgba(159,176,198,0.55); stroke-width: 2; stroke-dasharray: 5 5; }
    .curve .new { fill: none; stroke: var(--green); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s 2.9s var(--ease) forwards; filter: drop-shadow(0 0 6px rgba(16,163,127,0.7)); }
    .curve text { font-size: 9px; font-weight: 700; letter-spacing: 0.08em; fill: var(--muted); text-transform: uppercase; }
    .curve text.n { fill: #9ff0d6; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .stats { display: flex; gap: clamp(18px, 2.4vw, 44px); margin-top: clamp(18px, 3vh, 34px); animation: rise 1s 3.2s var(--ease) both; }
    .stat b { display: block; font-size: clamp(24px, 2.3vw, 42px); font-weight: 900; letter-spacing: -0.02em; }
    .stat span { font-size: clamp(11px, 0.9vw, 15px); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    .stat small { display: block; margin-top: 2px; font-size: clamp(10px, 0.75vw, 13px); color: rgba(159,176,198,0.7); letter-spacing: 0.04em; }

    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    @media (max-aspect-ratio: 1/1) {
      .photo { width: 100vw; opacity: 0.35; }
      .copy { left: 6vw; right: 6vw; }
      .zeros { grid-template-columns: 1fr; }
      .who { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01s !important; animation-delay: 0s !important; }
    }
  </style>
</head>
<body>

  <div class="stage">
    <div class="glow"></div>
    <div class="photo" aria-hidden="true"></div>
    <div class="who" id="who"></div>

    <div class="copy">
      <h2 class="date" id="date"></h2>
      <h1 class="title" id="title"></h1>
      <p class="sub" id="sub"></p>

      <div class="zeros">
        <div class="zero z1">
          <div class="k" id="k1"></div>
          <div class="v"><span class="arrow">→</span>0</div>
          <p id="p1"></p>
        </div>
        <div class="zero z2">
          <div class="k" id="k2"></div>
          <div class="v"><span class="arrow">→</span>0</div>
          <p id="p2"></p>
          <!-- prima: una curva lenta da scalare; con ChatGPT: subito in cima -->
          <svg class="curve" viewBox="0 0 220 64" aria-hidden="true">
            <path class="old" d="M4 58 C 60 58, 90 54, 120 36 S 180 8, 216 6"/>
            <path class="new" pathLength="1" d="M4 58 L 10 8 L 216 6"/>
            <text x="150" y="40" id="lOld"></text>
            <text x="16" y="20" class="n" id="lNew"></text>
          </svg>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><b id="s1v"></b><span id="s1l"></span></div>
        <div class="stat"><b id="s2v"></b><span id="s2l"></span><small id="s2n"></small></div>
      </div>
    </div>
  </div>

  <div id="nav-dots"></div>
  <a class="nav-arrow" id="nav-prev" href="#">&#8592;</a>
  <a class="nav-arrow" id="nav-next" href="#">&#8594;</a>

  <div id="lang-toggle">
    <button class="lang-btn" data-lang="it">IT</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>

  <script src="js/common.js"></script>
  <script>
    // 30 novembre 2022: OpenAI apre ChatGPT a tutti, gratis, come «research preview».
    // 1 milione di utenti in 5 giorni (Altman, 5 dicembre 2022);
    // 100 milioni di utenti attivi al mese a gennaio 2023 (stima UBS).
    const TXT = {
      it: {
        date: '30 novembre 2022', title: 'ChatGPT',
        sub: 'OpenAI lo mette online <b>per tutti, gratis</b>. Basta un browser.',
        k1: 'Time to market', p1: 'Nessun lancio, nessuna attesa: dalla sera alla mattina è nelle mani di chiunque.',
        k2: 'Curva di apprendimento', p2: 'Niente manuali né comandi: <b>si scrive come si parla</b>.',
        lOld: 'Prima', lNew: 'ChatGPT',
        s1v: '5 giorni', s1l: 'per 1 milione di utenti',
        s2v: '2 mesi', s2l: 'per 100 milioni', s2n: 'stima UBS, gennaio 2023',
        who: 'CEO di OpenAI<b>Sam Altman</b>'
      },
      en: {
        date: 'November 30, 2022', title: 'ChatGPT',
        sub: 'OpenAI puts it online <b>for everyone, for free</b>. All you need is a browser.',
        k1: 'Time to market', p1: 'No launch, no waiting: overnight it is in anyone’s hands.',
        k2: 'Learning curve', p2: 'No manuals, no commands: <b>you write the way you talk</b>.',
        lOld: 'Before', lNew: 'ChatGPT',
        s1v: '5 days', s1l: 'to 1 million users',
        s2v: '2 months', s2l: 'to 100 million', s2n: 'UBS estimate, January 2023',
        who: 'OpenAI CEO<b>Sam Altman</b>'
      }
    };

    function renderTexts() {
      const t = TXT[lang];
      ['date', 'k1', 'k2', 'lOld', 'lNew', 's1v', 's1l', 's2v', 's2l', 's2n'].forEach(k => document.getElementById(k).textContent = t[k]);
      ['sub', 'p1', 'p2', 'who'].forEach(k => document.getElementById(k).innerHTML = t[k]);
      const h = document.getElementById('title'); h.textContent = ''; h.setAttribute('aria-label', t.title);
      [...t.title].forEach((c, i) => {
        const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; s.setAttribute('aria-hidden', 'true');
        s.style.animationDelay = (0.55 + i * 0.06).toFixed(2) + 's'; h.appendChild(s);
      });
    }
    function onLangChange() { renderTexts(); }

    initLangToggle();
    renderTexts();
    initNav();
  </script>
</body>
</html>
