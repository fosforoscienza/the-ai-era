<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La nascita dell'AI — la voce della proposta</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root { --accent: #41b7ff; --accent-soft: #8fd2ff; --ink: #02040b; --ease: cubic-bezier(0.16,1,0.3,1); }
    html, body { background: var(--ink) !important; overflow: hidden; height: 100%; margin: 0; }
    body { font-family: inherit; }

    .stage { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }

    /* ---------- Atmosfera: fascio di luce, nebbia, polvere ---------- */
    .beam {
      position: absolute; left: -20vw; top: -30vh; width: 95vw; height: 160vh; pointer-events: none;
      background: linear-gradient(90deg, transparent 0%, rgba(65,183,255,0.10) 35%, rgba(143,210,255,0.16) 50%, rgba(65,183,255,0.08) 65%, transparent 100%);
      transform: rotate(-24deg); transform-origin: 50% 0;
      mix-blend-mode: screen; opacity: 0;
      animation: beamIn 2.4s 0.2s ease both, flicker 7s 2.6s ease-in-out infinite;
    }
    @keyframes beamIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes flicker { 0%,100% { opacity: 1; } 42% { opacity: 0.82; } 46% { opacity: 0.95; } 70% { opacity: 0.88; } }
    .fog { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(40px); opacity: 0; }
    .fog.f1 { left: -10vw; bottom: -20vh; width: 70vw; height: 60vh;
      background: radial-gradient(closest-side, rgba(31,127,209,0.22), transparent);
      animation: fade 3s 0.4s ease both, drift1 22s ease-in-out infinite alternate; }
    .fog.f2 { left: 30vw; top: 10vh; width: 50vw; height: 50vh;
      background: radial-gradient(closest-side, rgba(65,183,255,0.10), transparent);
      animation: fade 3s 0.8s ease both, drift2 26s ease-in-out infinite alternate; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes drift1 { to { transform: translate(6vw, -3vh); } }
    @keyframes drift2 { to { transform: translate(-5vw, 4vh); } }
    #dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    /* ---------- La figura in penombra, di profilo verso le parole ---------- */
    .figure {
      position: absolute; left: -4vw; bottom: 0; height: 100%; width: auto; aspect-ratio: 1000 / 1080;
      max-width: 60vw;
    }
    .figure svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .fig-in { opacity: 0; animation: figIn 2.6s 0.3s var(--ease) both; }
    @keyframes figIn { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
    .breathe { transform-box: view-box; transform-origin: 500px 1080px; animation: breathe 5.5s 3s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.006) translateY(-2px); } }
    .rim { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.8s 0.9s cubic-bezier(0.65,0,0.35,1) forwards, rimFlicker 6s 4s ease-in-out infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes rimFlicker { 0%,100% { opacity: 1; } 50% { opacity: 0.78; } }
    .side-light { opacity: 0; animation: fade 2.4s 1.6s ease both; }

    /* la voce: onde che escono dalla bocca */
    .waves { opacity: 0; transition: opacity 1.2s ease; }
    .stage.speaking .waves { opacity: 1; }
    .stage.done .waves { opacity: 0.35; }
    .wave { fill: none; stroke: var(--accent-soft); stroke-width: 3; stroke-linecap: round;
      transform-box: fill-box; transform-origin: 0% 50%;
      animation: wave 1.8s ease-out infinite; opacity: 0; }
    .wave:nth-child(2) { animation-delay: 0.45s; }
    .wave:nth-child(3) { animation-delay: 0.9s; }
    .wave:nth-child(4) { animation-delay: 1.35s; }
    @keyframes wave {
      0%   { opacity: 0;    transform: scale(0.35); }
      15%  { opacity: 0.95; }
      100% { opacity: 0;    transform: scale(2.6); }
    }

    .vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 240px 60px rgba(0,0,0,0.8); }

    /* ---------- Le scritte, a destra ---------- */
    .copy {
      position: absolute; z-index: 3; left: 47vw; right: 6vw; top: 50%; transform: translateY(-50%);
    }
    .eyebrow {
      font-size: clamp(13px, 1.1vw, 19px); font-weight: 700; letter-spacing: 0.34em;
      text-transform: uppercase; color: var(--accent-soft);
      animation: rise 1s 1.1s var(--ease) both;
    }
    .name {
      margin: clamp(10px, 1.6vh, 18px) 0 0; line-height: 0.92;
      font-size: clamp(48px, 5.8vw, 112px); font-weight: 900; letter-spacing: -0.03em; text-transform: uppercase;
    }
    .name .ch {
      display: inline-block;
      background: linear-gradient(180deg, #ffffff 30%, #8fd2ff 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: chIn 1s var(--ease) both;
    }
    .name .word { display: inline-block; white-space: nowrap; }
    @keyframes chIn {
      from { opacity: 0; transform: translateY(0.35em); filter: blur(14px); }
      to   { opacity: 1; transform: none;               filter: blur(0); }
    }
    .rule {
      width: min(420px, 30vw); height: 1px; margin: clamp(22px, 3.4vh, 38px) 0;
      background: linear-gradient(90deg, rgba(143,210,255,0.7), transparent);
      transform-origin: 0 50%; animation: grow 1.2s 2.2s var(--ease) both;
    }
    @keyframes grow { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }

    .quote { position: relative; margin: 0;
      font-size: clamp(24px, 2.3vw, 44px); line-height: 1.38; font-weight: 300; color: #dbe6f3; }
    .quote .mark {
      position: absolute; left: -0.62em; top: -0.42em; font-size: 2.6em; line-height: 1; font-weight: 300;
      color: var(--accent); opacity: 0; animation: markIn 1s 2.5s var(--ease) forwards;
    }
    @keyframes markIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 0.55; transform: none; } }
    .quote .w { display: inline-block; opacity: 0; animation: wIn 0.8s var(--ease) both; }
    .quote .w.hl { font-weight: 600; color: #fff; text-shadow: 0 0 26px rgba(65,183,255,0.75); }
    @keyframes wIn {
      from { opacity: 0; transform: translateY(0.45em); filter: blur(8px); }
      to   { opacity: 1; transform: none;               filter: blur(0); }
    }
    .who {
      margin-top: clamp(20px, 3vh, 34px);
      font-size: clamp(11px, 0.9vw, 15px); font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(143,210,255,0.75); opacity: 0;
    }
    .who.on { animation: rise 1s var(--ease) forwards; }
    .who b { color: #cfe9ff; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    @media (max-aspect-ratio: 1/1) {
      .figure { left: -20vw; opacity: 0.45; max-width: none; }
      .copy { left: 8vw; right: 8vw; }
      .name { font-size: 11vw; }
      .quote { font-size: 5vw; }
      .quote .mark { left: -0.45em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>

  <div class="stage" id="stage">
    <div class="beam"></div>
    <div class="fog f1"></div>
    <div class="fog f2"></div>
    <canvas id="dust"></canvas>

    <!-- Una figura qualunque, di profilo e in controluce: non un ritratto -->
    <div class="figure" aria-hidden="true">
      <svg viewBox="0 0 1000 1080" preserveAspectRatio="xMinYMax meet">
        <defs>
          <path id="body" d="M40 1080 C60 900 150 820 260 790 C300 780 320 760 325 720 C330 690 300 660 290 600
            C270 480 330 330 470 310 C580 295 650 360 660 430 C665 460 668 480 676 500 C682 512 690 520 688 530
            L684 545 C690 570 712 600 722 615 C726 622 720 630 706 632 C700 640 704 650 708 656
            C712 662 704 668 702 672 C708 680 704 690 696 694 C694 705 700 720 694 735
            C686 755 660 765 630 768 C600 770 585 790 585 810 C590 840 640 860 700 870
            C790 885 860 940 900 1080 Z"/>
          <clipPath id="clip-body"><use href="#body"/></clipPath>
          <linearGradient id="g-fill" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#010207"/>
            <stop offset="0.75" stop-color="#040913"/>
            <stop offset="1" stop-color="#08142a"/>
          </linearGradient>
          <radialGradient id="g-side" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#41b7ff" stop-opacity="0.22"/>
            <stop offset="1" stop-color="#41b7ff" stop-opacity="0"/>
          </radialGradient>
          <!-- la luce viene dalle parole: si accende solo il bordo davanti -->
          <linearGradient id="g-rim-mask" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0.52" stop-color="#000"/>
            <stop offset="0.68" stop-color="#fff"/>
          </linearGradient>
          <mask id="m-rim" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1080">
            <rect width="1000" height="1080" fill="url(#g-rim-mask)"/>
          </mask>
          <linearGradient id="g-rim-fall" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0.25" stop-color="#fff"/>
            <stop offset="0.66" stop-color="#fff"/>
            <stop offset="0.80" stop-color="#666"/>
            <stop offset="0.97" stop-color="#000"/>
          </linearGradient>
          <mask id="m-fall" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1080">
            <rect width="1000" height="1080" fill="url(#g-rim-fall)"/>
          </mask>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="7" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
        </defs>

        <g class="fig-in"><g class="breathe">
          <use href="#body" fill="url(#g-fill)"/>
          <g clip-path="url(#clip-body)" class="side-light">
            <ellipse cx="790" cy="600" rx="230" ry="460" fill="url(#g-side)"/>
          </g>
          <g mask="url(#m-fall)"><g mask="url(#m-rim)">
            <use href="#body" class="rim" pathLength="1" fill="none" stroke="#41b7ff" stroke-width="26" stroke-opacity="0.32" filter="url(#soft)"/>
            <use href="#body" class="rim" pathLength="1" fill="none" stroke="#bfe6ff" stroke-width="3" filter="url(#glow)"/>
          </g></g>
          <g class="waves" transform="translate(728 666)">
            <path class="wave" d="M0 -38 A38 38 0 0 1 0 38"/>
            <path class="wave" d="M0 -38 A38 38 0 0 1 0 38"/>
            <path class="wave" d="M0 -38 A38 38 0 0 1 0 38"/>
            <path class="wave" d="M0 -38 A38 38 0 0 1 0 38"/>
          </g>
        </g></g>
      </svg>
    </div>

    <div class="vignette"></div>

    <div class="copy">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="name" id="name"></h1>
      <div class="rule"></div>
      <p class="quote" id="quote"><span class="mark">«</span></p>
      <div class="who" id="who"></div>
    </div>
  </div>

  <div id="nav-dots"></div>
  <a class="nav-arrow" id="nav-prev" href="dartmouth-1956.html">&#8592;</a>
  <a class="nav-arrow" id="nav-next" href="dartmouth-1956-2.html">&#8594;</a>

  <div id="lang-toggle">
    <button class="lang-btn" data-lang="it">IT</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>

  <script src="js/common.js"></script>
  <script>
    // Citazione dalla proposta del 31 agosto 1955 (McCarthy, Minsky, Rochester, Shannon).
    // [testo normale, testo in evidenza]
    const TXT = {
      it: {
        eyebrow: 'Dartmouth College · Estate 1956',
        name: "La nascita dell'AI",
        quote: ["Ogni aspetto dell'apprendimento, o qualsiasi altra caratteristica dell'intelligenza, può in linea di principio essere descritto con tale precisione che",
                'una macchina potrà simularlo.»'],
        who: '<b>McCarthy · Minsky · Rochester · Shannon</b> — proposta per il seminario di Dartmouth, 1955'
      },
      en: {
        eyebrow: 'Dartmouth College · Summer 1956',
        name: 'The birth of AI',
        quote: ['Every aspect of learning or any other feature of intelligence can in principle be so precisely described that',
                'a machine can be made to simulate it.»'],
        who: '<b>McCarthy · Minsky · Rochester · Shannon</b> — Dartmouth summer research proposal, 1955'
      }
    };

    const stage = document.getElementById('stage');
    let timers = [];
    function renderTexts() {
      timers.forEach(clearTimeout); timers = [];
      stage.classList.remove('speaking', 'done');
      const t = TXT[lang];
      document.getElementById('eyebrow').textContent = t.eyebrow;

      // titolo lettera per lettera
      const name = document.getElementById('name'); name.textContent = '';
      name.setAttribute('aria-label', t.name);
      let i = 0;
      t.name.toUpperCase().split(' ').forEach((word, k) => {      // lettere raggruppate per parola: a capo solo tra parole
        if (k) name.appendChild(document.createTextNode(' '));
        const w = document.createElement('span'); w.className = 'word'; w.setAttribute('aria-hidden', 'true');
        [...word].forEach(c => {
          const s = document.createElement('span'); s.className = 'ch'; s.textContent = c;
          s.style.animationDelay = (1.3 + i++ * 0.045).toFixed(3) + 's';
          w.appendChild(s);
        });
        name.appendChild(w);
      });

      // la citazione parola per parola, mentre la figura «parla»
      const q = document.getElementById('quote');
      const mark = q.querySelector('.mark'); q.textContent = ''; q.appendChild(mark);
      const T0 = 2.8, STEP = 0.11;
      let n = 0;
      t.quote.forEach((part, k) => part.split(' ').forEach(word => {
        if (n) q.appendChild(document.createTextNode(' '));
        const s = document.createElement('span');
        s.className = 'w' + (k === 1 ? ' hl' : '');
        s.textContent = word;
        s.style.animationDelay = (T0 + n++ * STEP).toFixed(2) + 's';
        q.appendChild(s);
      }));
      const end = (T0 + n * STEP) * 1000;
      const who = document.getElementById('who');
      who.innerHTML = t.who; who.classList.remove('on');
      timers.push(setTimeout(() => stage.classList.add('speaking'), T0 * 1000 - 200));
      timers.push(setTimeout(() => { stage.classList.add('done'); who.classList.add('on'); }, end + 300));
    }
    function onLangChange() { renderTexts(); }

    // Polvere sospesa nel fascio di luce
    function startDust(cv) {
      const ctx = cv.getContext('2d');
      const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let W, H, P = [];
      function init() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        P = Array.from({ length: Math.round(W * H / 14000) }, () => ({
          x: Math.random() * W, y: Math.random() * H, r: 0.6 + Math.random() * 1.8,
          vx: (Math.random() - 0.3) * 0.12, vy: -0.05 - Math.random() * 0.18, a: Math.random() * Math.PI * 2
        }));
      }
      // il fascio: banda inclinata che scende da sinistra in alto
      const inBeam = (x, y) => { const d = (x - 0.18 * W) * Math.cos(0.42) + (y) * Math.sin(0.42) - 0.30 * W; return Math.max(0, 1 - Math.abs(d) / (0.22 * W)); };
      function frame(t) {
        ctx.clearRect(0, 0, W, H);
        for (const p of P) {
          if (!still) { p.x += p.vx; p.y += p.vy; p.a += 0.01; }
          if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
          if (p.x > W + 5) p.x = -5;
          const b = 0.12 + 0.75 * inBeam(p.x, p.y);
          ctx.globalAlpha = b * (0.6 + 0.4 * Math.sin(p.a + t / 900));
          ctx.fillStyle = '#cfe9ff';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
        if (!still) requestAnimationFrame(frame);
      }
      init(); addEventListener('resize', init);
      requestAnimationFrame(frame);
    }

    initLangToggle();
    renderTexts();
    initNav();
    startDust(document.getElementById('dust'));
  </script>
</body>
