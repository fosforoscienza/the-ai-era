<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grazie — Saturday Night Science</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root { --accent: #41b7ff; --accent-soft: #8fd2ff; --accent-deep: #1f7fd1; --ease: cubic-bezier(0.16,1,0.3,1); }
    html, body { background: #02040b !important; overflow: hidden; height: 100%; margin: 0; }
    body { font-family: inherit; color: #fff; }

    /* ---------- Fondo: rete neurale tenue e alone blu ---------- */
    #sky { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0.32; z-index: 0; }
    .halo { position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(48% 60% at 76% 46%, rgba(65,183,255,0.14), rgba(2,4,11,0) 70%); }

    /* ---------- Foto sul palco: entra da sinistra, lento avvicinamento ---------- */
    .photo { position: fixed; top: 0; bottom: 0; left: 0; width: 56vw; z-index: 1; overflow: hidden;
      -webkit-mask-image: linear-gradient(90deg, #000 52%, rgba(0,0,0,0.55) 74%, transparent 100%);
              mask-image: linear-gradient(90deg, #000 52%, rgba(0,0,0,0.55) 74%, transparent 100%);
      animation: photoIn 1.6s var(--ease) both; }
    .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 68% 30%; display: block;
      transform-origin: 40% 30%; animation: kenburns 26s ease-in-out 0.4s both alternate infinite; }
    .photo::after { content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(2,4,11,0.25) 0%, rgba(2,4,11,0) 30%, rgba(2,4,11,0) 70%, rgba(2,4,11,0.75) 100%); }
    @keyframes photoIn { from { opacity: 0; transform: translateX(-4vw); } to { opacity: 1; transform: none; } }
    @keyframes kenburns { from { transform: scale(1.04); } to { transform: scale(1.14) translate(1%, 1%); } }

    /* ---------- Colonna destra ---------- */
    .side { position: fixed; z-index: 2; top: 50%; right: 5.5vw; transform: translateY(-50%);
      width: 44vw; display: flex; flex-direction: column; align-items: flex-start; }

    .eyebrow { display: inline-flex; align-items: center; gap: 14px;
      font-size: clamp(12px, 1vw, 18px); font-weight: 700; letter-spacing: 0.34em; text-transform: uppercase;
      color: var(--accent-soft); animation: up 0.9s var(--ease) 0.5s both; }
    .eyebrow::before { content: ''; width: 40px; height: 2px; background: linear-gradient(90deg, var(--accent), transparent); }

    .thanks { margin: 0; font-weight: 900; line-height: 0.86; letter-spacing: -0.035em;
      font-size: min(10.4vw, 21vh); width: max-content; white-space: nowrap; }
    .thanks .ch { display: inline-block; padding-right: 0.02em;
      background: linear-gradient(180deg, #ffffff 35%, var(--accent-soft) 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
      animation: chIn 1.1s var(--ease) both; }
    @keyframes chIn { from { opacity: 0; transform: translateY(0.35em) scale(0.92); filter: blur(10px); }
                      to   { opacity: 1; transform: none; filter: blur(0); } }

    .name { margin-top: 2.2vh; font-size: clamp(22px, 2.2vw, 42px); font-weight: 300; letter-spacing: 0.02em;
      color: rgba(255,255,255,0.86); animation: up 0.9s var(--ease) 1.2s both; }
    .name b { font-weight: 700; color: #fff; }

    /* social e sito: grandi, leggibili dal fondo della sala */
    .social { margin-top: 4.2vh; display: flex; align-items: center; gap: 1.6vw; animation: up 0.9s var(--ease) 1.5s both; }
    .icons { display: flex; gap: 0.8vw; }
    .ic { width: clamp(44px, 4vw, 78px); height: clamp(44px, 4vw, 78px); border-radius: 50%;
      display: grid; place-items: center; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(143,210,255,0.35); box-shadow: 0 0 30px rgba(65,183,255,0.18) inset;
      animation: pop 0.7s var(--ease) both; }
    .ic:nth-child(1) { animation-delay: 1.65s; } .ic:nth-child(2) { animation-delay: 1.78s; } .ic:nth-child(3) { animation-delay: 1.91s; }
    .ic svg { width: 52%; height: 52%; fill: #fff; }
    @keyframes pop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: none; } }
    /* le scritte delle tre righe partono allineate, qualunque sia il numero di icone */
    .social .icons { width: calc(2 * clamp(44px, 4vw, 78px) + 0.8vw); }
    .site .ic { margin-right: calc(clamp(44px, 4vw, 78px) + 0.8vw + 0.4vw); }
    .social.yt { margin-top: 2.2vh; animation-delay: 1.8s; }
    .social.yt .ic { animation-delay: 1.95s; }
    .handle { font-size: clamp(26px, 3vw, 58px); font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; }
    .handle span { color: var(--accent-soft); font-weight: 600; }

    .site { margin-top: 2.2vh; display: flex; align-items: center; gap: 1.2vw;
      font-size: clamp(30px, 3.5vw, 68px); font-weight: 800; letter-spacing: -0.01em; white-space: nowrap;
      animation: up 0.9s var(--ease) 2.1s both; }
    .site .ic { animation: none; }
    .site u { text-decoration: none; background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      background-size: 100% 4px; background-repeat: no-repeat; background-position: 0 100%; padding-bottom: 4px; }

    /* Fosforo */
    .fosforo { margin-top: 5vh; padding-top: 3.2vh; width: 100%; border-top: 1px solid rgba(143,210,255,0.22);
      display: flex; align-items: center; gap: 2vw; animation: up 0.9s var(--ease) 2.5s both; }
    .fosforo img { height: clamp(30px, 3.6vw, 66px); width: auto; display: block; }
    .fosforo .txt { display: flex; flex-direction: column; gap: 0.6vh; }
    .fosforo .web { font-size: clamp(22px, 2.3vw, 44px); font-weight: 800; white-space: nowrap; }
    .fosforo .soc { display: flex; align-items: center; gap: 0.6vw; font-size: clamp(14px, 1.3vw, 24px);
      color: rgba(255,255,255,0.75); white-space: nowrap; }
    .fosforo .soc svg { width: 1.05em; height: 1.05em; fill: var(--accent-soft); }

    @keyframes up { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }

    /* schermo stretto: foto sopra, testi sotto */
    @media (max-aspect-ratio: 4/3) {
      .photo { width: 100vw; bottom: 46vh;
        -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent 100%); mask-image: linear-gradient(180deg, #000 60%, transparent 100%); }
      .side { top: auto; bottom: 5vh; right: 6vw; left: 6vw; width: auto; transform: none; }
      .thanks { font-size: 17vw; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>

  <div class="halo"></div>

    <div class="name"><b>Mattia Crivellini</b></div>

      <div class="icons">
        <span class="ic" title="Facebook"><svg viewBox="0 0 24 24"><path d="M13.5 22v-8.2h2.8l.4-3.3h-3.2V8.4c0-.9.3-1.6 1.6-1.6h1.7V3.9a23 23 0 0 0-2.5-.1c-2.5 0-4.2 1.5-4.2 4.3v2.4H7.3v3.3h2.8V22h3.4z"/></svg></span>

      </div>
      <div class="handle"><span>@</span>mattia_crivellini</div>
    </div>

    <div class="social yt">
      <div class="icons">
        <span class="ic" title="YouTube"><svg viewBox="0 0 24 24"><path d="M22.5 7.2a2.8 2.8 0 0 0-2-2C18.8 4.7 12 4.7 12 4.7s-6.8 0-8.5.5a2.8 2.8 0 0 0-2 2C1 8.9 1 12 1 12s0 3.1.5 4.8a2.8 2.8 0 0 0 2 2c1.7.5 8.5.5 8.5.5s6.8 0 8.5-.5a2.8 2.8 0 0 0 2-2c.5-1.7.5-4.8.5-4.8s0-3.1-.5-4.8zM9.8 15.1V8.9l5.7 3.1-5.7 3.1z"/></svg></span>
      </div>
      <div class="handle"><span>@</span>MattiaCrivellini</div>
    </div>

    <div class="site">
      <span class="ic" title="Sito"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-3a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4zM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3zm.8 2h3a15.7 15.7 0 0 0 1.4 3.6A8 8 0 0 1 5.1 16zm3-8h-3a8 8 0 0 1 4.3-3.6C8.9 5.5 8.5 6.7 8.1 8zM12 20c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h3a8 8 0 0 1-4.4 3.6zm1.7-5.6a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4h-3.4z"/></svg></span>
      <u>crivellini.it</u>
    </div>

    <div class="fosforo">
      <img src="img/loghi/fosforo-bianco.png" alt="Fosforo" />
      <div class="txt">
        <div class="web">fosforoscienza.it</div>
        <div class="soc">
          <svg viewBox="0 0 24 24"><path d="M13.5 22v-8.2h2.8l.4-3.3h-3.2V8.4c0-.9.3-1.6 1.6-1.6h1.7V3.9a23 23 0 0 0-2.5-.1c-2.5 0-4.2 1.5-4.2 4.3v2.4H7.3v3.3h2.8V22h3.4z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M12 7.2a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6zm0 7.9a3.1 3.1 0 1 1 0-6.2 3.1 3.1 0 0 1 0 6.2zM17.1 5.8a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zM12 2.5c-2.6 0-2.9 0-3.9.1-3.5.2-5.4 2.1-5.6 5.6-.1 1-.1 1.3-.1 3.8s0 2.9.1 3.9c.2 3.5 2.1 5.4 5.6 5.6 1 .1 1.3.1 3.9.1s2.9 0 3.9-.1c3.5-.2 5.4-2.1 5.6-5.6.1-1 .1-1.3.1-3.9s0-2.8-.1-3.8c-.2-3.5-2.1-5.4-5.6-5.6-1-.1-1.3-.1-3.9-.1zm0 1.7c2.5 0 2.8 0 3.8.1 2.6.1 3.8 1.3 3.9 3.9.1 1 .1 1.3.1 3.8s0 2.8-.1 3.8c-.1 2.6-1.3 3.8-3.9 3.9-1 .1-1.3.1-3.8.1s-2.8 0-3.8-.1c-2.6-.1-3.8-1.3-3.9-3.9-.1-1-.1-1.3-.1-3.8s0-2.8.1-3.8c.1-2.6 1.3-3.8 3.9-3.9 1-.1 1.3-.1 3.8-.1z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M22.5 7.2a2.8 2.8 0 0 0-2-2C18.8 4.7 12 4.7 12 4.7s-6.8 0-8.5.5a2.8 2.8 0 0 0-2 2C1 8.9 1 12 1 12s0 3.1.5 4.8a2.8 2.8 0 0 0 2 2c1.7.5 8.5.5 8.5.5s6.8 0 8.5-.5a2.8 2.8 0 0 0 2-2c.5-1.7.5-4.8.5-4.8s0-3.1-.5-4.8zM9.8 15.1V8.9l5.7 3.1-5.7 3.1z"/></svg>
          <span>@fosforoscienza</span>
        </div>
      </div>
    </div>
  </div>

  <div id="nav-dots"></div>
  <a class="nav-arrow" id="nav-prev" href="#">&#8592;</a>
  <a class="nav-arrow" id="nav-next" href="#">&#8594;</a>

  <div id="lang-toggle">
    <button class="lang-btn" data-lang="it">IT</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>

  <script src="js/common.js"></script>
  <script src="js/rete-neurale.js"></script>
  <script>
    // «Grazie» lettera per lettera
    const WORD = { it: 'Grazie', en: 'Thank you' };
    function renderThanks() {
      const el = document.getElementById('thanks');
      el.textContent = '';
      el.setAttribute('aria-label', WORD[lang]);
      [...WORD[lang].toUpperCase()].forEach((c, i) => {
        const s = document.createElement('span');
        s.className = 'ch'; s.setAttribute('aria-hidden', 'true');
        s.textContent = c === ' ' ? ' ' : c;
        s.style.animationDelay = (0.7 + i * 0.07).toFixed(2) + 's';
        el.appendChild(s);
      });
    }
    function onLangChange() { renderThanks(); }

    initLangToggle();
    renderThanks();
    initNav();
    startNeuralNet(document.getElementById('sky'));

    // ?t=… blocca le animazioni a quell'istante (miniature)
    const T = parseFloat(new URLSearchParams(location.search).get('t'));
    if (isFinite(T)) document.getAnimations().forEach(a => { a.pause(); a.currentTime = T * 1000; });
  </script>
</body>
</html>
