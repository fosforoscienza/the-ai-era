<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#02040b" />
  <title>Conosciamoci meglio — The AI Era</title>
  <style>
    :root { --bg: #02040b; --card: #0b1220; --line: rgba(143,210,255,0.16); --accent: #41b7ff; --soft: #8fd2ff; --text: #fff; --muted: #9fb0c6;
            --ease: cubic-bezier(0.16,1,0.3,1); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; min-height: 100vh;
      background: radial-gradient(90% 40% at 80% 0%, rgba(65,183,255,0.16), transparent 70%), var(--bg); }
    main { max-width: 560px; margin: 0 auto; padding: 28px 16px calc(40px + env(safe-area-inset-bottom)); }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: var(--soft); }
    h1 { margin: 8px 0 6px; font-size: 38px; line-height: 1; font-weight: 900; letter-spacing: -0.03em; }
    .intro { margin: 0 0 22px; color: var(--muted); font-size: 16px; line-height: 1.45; }
    .part { margin: 26px 0 12px; display: flex; align-items: center; gap: 12px; }
    .part b { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #02040b; font-weight: 900; }
    .part span { font-size: 19px; font-weight: 800; line-height: 1.2; }
    .q { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
    .q h2 { margin: 0; font-size: 17px; font-weight: 800; }
    .q .hint { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
    .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .opt { appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,0.03); color: var(--text); font: inherit; font-size: 15px;
      padding: 10px 13px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; transition: background .2s, border-color .2s, transform .15s; }
    .opt:active { transform: scale(0.96); }
    .opt.on { background: var(--accent); border-color: var(--accent); color: #02040b; font-weight: 700; }
    .opt[disabled] { opacity: 0.35; }
    .opts.col { flex-direction: column; }
    .opts.col .opt { border-radius: 14px; width: 100%; }
    .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 12px; }
    .scale .opt { flex-direction: column; border-radius: 14px; padding: 10px 2px; gap: 4px; font-size: 11px; line-height: 1.15; text-align: center; justify-content: flex-start; }
    .opt .ic { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--soft);
      background: linear-gradient(160deg, rgba(143,210,255,.16), rgba(143,210,255,.04)); border: 1px solid rgba(143,210,255,.2); transition: background .2s, color .2s; }
    .opt .ic svg { width: 16px; height: 16px; }
    .opt.on .ic { color: #02040b; background: rgba(2,4,11,.12); border-color: rgba(2,4,11,.18); }
    .scale .opt .ic { width: 38px; height: 38px; border-radius: 50%; }
    .scale .opt .ic svg { width: 28px; height: 28px; }
    input[type=text] { width: 100%; margin-top: 12px; font: inherit; font-size: 17px; color: var(--text); background: rgba(255,255,255,0.04);
      border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; }
    input[type=text]:focus { border-color: var(--accent); }
    .send { width: 100%; margin-top: 18px; padding: 17px; border: 0; border-radius: 16px; font: inherit; font-size: 18px; font-weight: 800; color: #02040b;
      background: linear-gradient(135deg, #8fd2ff, #41b7ff); cursor: pointer; box-shadow: 0 10px 30px rgba(65,183,255,0.3); }
    .send[disabled] { opacity: 0.5; }
    .err { min-height: 20px; margin-top: 10px; color: #ff8a98; font-size: 14px; text-align: center; }
    .note { margin-top: 14px; font-size: 12px; color: var(--muted); text-align: center; }
    .done { text-align: center; padding-top: 12vh; }
    .done .big { width: 96px; height: 96px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; color: #02040b;
      background: linear-gradient(135deg, #8fd2ff, #41b7ff); box-shadow: 0 10px 40px rgba(65,183,255,0.4); animation: pop .8s var(--ease) both; }
    .done .big svg { width: 50px; height: 50px; stroke-width: 2.4; }
    .done h1 { margin-top: 16px; }
    .done p { color: var(--muted); font-size: 17px; line-height: 1.45; }
    .done a { display: inline-block; margin-top: 18px; color: var(--soft); font-weight: 700; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  </style>
</head>
<body>
  <main id="app"></main>

  <script src="js/sns-config.js"></script>
  <script src="js/questionario.js?v=3"></script>
  <script>
    const app = document.getElementById('app');
    const POST = QZ.FASE === 'post';
    const DONE_KEY = 'sns-questionario-' + QZ.EVENTO + (POST ? '-post' : '');
    const answers = { strumenti: [], usi: [], paure: [], opportunita: [] };
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const resultsHref = (POST ? 'confronto.html' : 'risultati.html') + (QZ.EVENTO !== 'sns' ? '?e=' + encodeURIComponent(QZ.EVENTO) : '');

    function done(again) {
      app.innerHTML = `<div class="done"><div class="big">${QZ.CHECK}</div><h1>Grazie!</h1>
        <p>${again ? 'Hai già risposto da questo telefono.' : 'Le tue risposte sono arrivate.'}<br>Guarda lo schermo: tra poco ${POST ? 'il confronto tra inizio e fine serata' : 'i risultati di tutta la sala'}.</p>
        <a href="${resultsHref}">Vedi i risultati →</a>
        ${again ? '<br><a href="#" id="redo" style="font-weight:400;font-size:14px;color:#9fb0c6">Rispondi di nuovo</a>' : ''}</div>`;
      const redo = document.getElementById('redo');
      if (redo) redo.onclick = e => { e.preventDefault(); form(); };
    }

    function question(key) {
      const q = QZ.Q[key];
      if (q.type === 'text') return `<div class="q"><h2>${q.title}</h2><p class="hint">${q.hint}</p>
        <input type="text" id="parola" maxlength="${q.max}" autocomplete="off" placeholder="Per esempio: opportunità"></div>`;
      const cls = q.type === 'scale' ? 'scale' : 'opts' + (key === 'frequenza' ? ' col' : '');
      const btns = q.opts.map(o => q.type === 'scale'
        ? `<button type="button" class="opt" data-k="${key}" data-v="${o[0]}"><span class="ic">${QZ.icon(key, o[0])}</span>${o[1]}</button>`
        : `<button type="button" class="opt" data-k="${key}" data-v="${o[0]}"><span class="ic">${QZ.icon(key, o[0])}</span>${esc(o[1])}</button>`).join('');
      return `<div class="q" id="q-${key}"><h2>${q.title}</h2>${q.hint ? `<p class="hint">${q.hint}</p>` : ''}<div class="${cls}">${btns}</div></div>`;
    }

    function form() {
      app.innerHTML = `
        <div class="eyebrow">The AI Era</div>
        ${POST ? `<h1>E adesso?</h1>
        <p class="intro">Le stesse domande di inizio serata, solo sul futuro. Un minuto, tutto anonimo: vediamo se qualcosa è cambiato.</p>` : `<h1>Conosciamoci meglio</h1>
        <p class="intro">Due minuti, sette domande, tutto anonimo. Le risposte di tutta la sala compaiono sullo schermo.</p>
        <div class="part"><b>1</b><span>Come usi l’AI nella tua quotidianità</span></div>
        ${['frequenza', 'strumenti', 'usi'].map(question).join('')}`}
        <div class="part"><b>2</b><span>Come vedi il futuro dell’AI: paure e opportunità</span></div>
        ${['futuro', 'paure', 'opportunita', 'parola'].map(question).join('')}
        <button class="send" id="send">Invia le risposte</button>
        <div class="err" id="err"></div>
        <div class="note">Nessun dato personale: salviamo solo le risposte.</div>`;
      app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => toggle(b)));
      document.getElementById('send').onclick = submit;
    }

    function toggle(b) {
      const k = b.dataset.k, q = QZ.Q[k], v = q.type === 'scale' ? +b.dataset.v : b.dataset.v;
      const group = app.querySelectorAll(`.opt[data-k="${k}"]`);
      if (q.type !== 'many') {
        answers[k] = v; group.forEach(x => x.classList.toggle('on', x === b));
      } else {
        const list = answers[k], i = list.indexOf(v);
        const exclusive = v === 'nessuno' || v === 'nessuna';
        if (i >= 0) list.splice(i, 1);
        else if (exclusive) list.splice(0, list.length, v);
        else { const j = list.findIndex(x => x === 'nessuno' || x === 'nessuna'); if (j >= 0) list.splice(j, 1); list.push(v); }
        group.forEach(x => x.classList.toggle('on', list.includes(x.dataset.v)));
        if (q.max) group.forEach(x => x.disabled = !x.classList.contains('on') && list.length >= q.max);
      }
      document.getElementById('err').textContent = '';
    }

    async function submit() {
      const err = document.getElementById('err'), send = document.getElementById('send');
      if (!POST && !answers.frequenza) { err.textContent = 'Dicci quanto spesso usi l’AI (domanda 1).'; document.getElementById('q-frequenza').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      if (!answers.futuro) { err.textContent = 'Dicci come vedi il futuro (parte 2).'; document.getElementById('q-futuro').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      send.disabled = true; send.textContent = 'Invio…';
      try {
        await QZ.insert(Object.assign({}, answers, { parola: document.getElementById('parola').value.trim().slice(0, 40) || null }));
        try { localStorage.setItem(DONE_KEY, '1'); } catch (e) {}
        window.scrollTo(0, 0); done(false);
      } catch (e) {
        send.disabled = false; send.textContent = 'Invia le risposte';
        err.textContent = 'Non sono riuscito a inviare. Controlla la connessione e riprova.';
      }
    }

    let already = false;
    try { already = localStorage.getItem(DONE_KEY) === '1'; } catch (e) {}
    already ? done(true) : form();
  </script>
</body>
</html>
