<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#02040b" />
  <title>Il pubblico di stasera — come usa l'AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root { --accent: #41b7ff; --soft: #8fd2ff; --muted: #9fb0c6; --line: rgba(143,210,255,0.14); --card: rgba(11,18,32,0.72);
            --red: #ff5468; --cyan: #41e0ff; --ease: cubic-bezier(0.16,1,0.3,1); }
    html, body { background: #02040b !important; overflow: hidden; height: 100%; margin: 0; }
    body { color: #fff; font-family: inherit; }
    .bg { position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(50% 60% at 85% 0%, rgba(65,183,255,0.15), transparent 70%),
                  radial-gradient(45% 55% at 0% 100%, rgba(65,224,255,0.06), transparent 70%); }
    .wrap { position: relative; z-index: 1; height: 100vh; display: grid; grid-template-rows: auto 1fr auto; gap: 2vh; padding: 3.4vh 3vw 7.5vh; box-sizing: border-box; }

    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 2vw; animation: up .8s var(--ease) both; }
    .eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 1.5vh; font-weight: 700; letter-spacing: .34em; text-transform: uppercase; color: var(--soft); }
    .eyebrow::before { content: ''; width: 34px; height: 2px; background: linear-gradient(90deg, var(--accent), transparent); }
    h1 { margin: 0; font-size: 10.5vh; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
    h1 em { font-style: normal; background: linear-gradient(90deg, var(--soft), var(--cyan)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .count { display: flex; align-items: baseline; gap: 1vw; text-align: right; }
    .count b { font-size: 9vh; font-weight: 900; line-height: .9; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, #fff 30%, var(--soft)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .count > span { font-size: 2.2vh; color: var(--muted); line-height: 1.3; text-align: left; }
    .live { display: inline-flex; align-items: center; gap: 8px; color: #ff8a98; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 1.5vh; }
    .live::before { content: ''; width: 1vh; height: 1vh; border-radius: 50%; background: var(--red); box-shadow: 0 0 1.4vh var(--red); animation: blink 1.6s infinite; }
    .count.bump b { animation: bump .6s var(--ease); }

    .grid { display: grid; grid-template-columns: 1fr 1fr 1.15fr; gap: 1.2vw; min-height: 0; }
    .card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 2vh; padding: 2.4vh 1.6vw; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
      animation: up .9s var(--ease) both; }
    .card:nth-child(2) { animation-delay: .15s; } .card:nth-child(3) { animation-delay: .3s; }
    .card h2 { margin: 0 0 1.8vh; font-size: 1.7vh; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--soft); }

    /* frequenza */
    .hero { display: flex; align-items: baseline; gap: 1vw; }
    .hero b { font-size: 13vh; font-weight: 900; line-height: .85; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
    .hero span { font-size: 2.3vh; color: var(--muted); line-height: 1.25; }
    .hero span em { font-style: normal; color: #fff; font-weight: 700; }
    .stack { display: flex; height: 3.6vh; border-radius: 1vh; overflow: hidden; margin: 2.4vh 0 2vh; background: rgba(255,255,255,.05); }
    .stack div { height: 100%; flex: 0 0 0; min-width: 0; transition: flex-grow 1s var(--ease); }
    .levels { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .lv { display: grid; grid-template-columns: 1.6vh 3vh 1fr auto; align-items: center; gap: .7vw; font-size: 2vh; }
    .lv .sw { width: 1.6vh; height: 1.6vh; border-radius: .4vh; background: var(--c); }
    /* icone: chip vettoriali al posto delle emoji */
    .ic { display: inline-grid; place-items: center; flex: none; color: var(--soft); border-radius: 28%;
      background: linear-gradient(160deg, rgba(143,210,255,.16), rgba(143,210,255,.04)); border: 1px solid rgba(143,210,255,.22);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
    .ic svg { width: 58%; height: 58%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .lv .ic { width: 3vh; height: 3vh; }
    .lv b { font-size: 2.6vh; font-weight: 900; font-variant-numeric: tabular-nums; }

    /* strumenti */
    .bars { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .bar { display: grid; grid-template-columns: 3.4vh 1fr auto; align-items: center; gap: .5vh .7vw; }
    .bar .ic { width: 3.4vh; height: 3.4vh; grid-row: span 2; }
    .bar .lb { font-size: 2vh; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar .pc { font-size: 2.5vh; font-weight: 900; font-variant-numeric: tabular-nums; grid-row: span 2; min-width: 4.6vw; text-align: right; }
    .bar .tr { height: 1.2vh; border-radius: 1vh; background: rgba(255,255,255,.06); overflow: hidden; }
    .bar .tr div { height: 100%; width: 0; border-radius: 1vh; background: linear-gradient(90deg, #2f9cf0, var(--soft)); transition: width 1s var(--ease); }
    .bar.first .ic, .tile.top .ic { color: #02040b; background: linear-gradient(160deg, var(--soft), var(--cyan)); border-color: transparent; box-shadow: 0 0 1.4vh rgba(65,224,255,.45); }
    .bar.first .tr div { background: linear-gradient(90deg, var(--soft), var(--cyan)); box-shadow: 0 0 1.4vh rgba(65,224,255,.5); }

    /* usi */
    .tiles { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 1vh; min-height: 0; }
    .tile { position: relative; border-radius: 1.4vh; background: rgba(255,255,255,.04); overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding: 0 1vw; }
    .tile .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(0deg, rgba(65,183,255,.6), rgba(65,183,255,.15)); transition: height 1s var(--ease); }
    .tile > span { position: relative; display: flex; align-items: center; gap: .6vw; }
    .tile .ic { width: 3.6vh; height: 3.6vh; }
    .tile .pc { font-size: 3.4vh; font-weight: 900; font-variant-numeric: tabular-nums; }
    .tile .lb { position: relative; font-size: 1.65vh; line-height: 1.15; color: #dbe7f5; margin-top: .5vh; }
    .tile.top { outline: 2px solid var(--cyan); box-shadow: 0 0 2.4vh rgba(65,224,255,.3); }

    /* identikit */
    .profile { display: flex; align-items: center; gap: 1.4vw; padding: 2vh 2vw; border-radius: 2vh; animation: up .9s var(--ease) .45s both;
      background: linear-gradient(90deg, rgba(65,183,255,.16), rgba(65,224,255,.05)); border: 1px solid rgba(143,210,255,.25); }
    .profile .ic { width: 6.4vh; height: 6.4vh; border-radius: 30%; color: #02040b; border: 0;
      background: linear-gradient(160deg, var(--soft), var(--cyan)); box-shadow: 0 0 2.6vh rgba(65,224,255,.35); }
    .profile .ic svg { stroke-width: 1.6; }
    .profile small { display: block; font-size: 1.5vh; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: var(--soft); }
    .profile p { margin: .4vh 0 0; font-size: 3vh; font-weight: 300; line-height: 1.2; }
    .profile p b { font-weight: 800; color: #fff; }

    .wait { position: fixed; inset: 0; z-index: 3; display: none; place-items: center; text-align: center; background: rgba(2,4,11,.55); backdrop-filter: blur(3px); }
    .wait.on { display: grid; }
    .wait b { display: block; font-size: 4vh; font-weight: 900; }
    .wait span { color: var(--muted); font-size: 2.2vh; }

    @keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: .25; } }
    @keyframes bump { 40% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    /* da telefono (/risultati): una colonna che scorre */
    @media (max-aspect-ratio: 1/1), (max-width: 760px) {
      html, body { overflow: auto; height: auto; }
      #nav-dots, .nav-arrow, #lang-toggle, .wait { display: none !important; }
      .wrap { height: auto; padding: 24px 16px 40px; gap: 14px; grid-template-rows: none; }
      header { flex-direction: column; align-items: flex-start; }
      .eyebrow { font-size: 11px; } h1 { font-size: 44px; }
      .count b { font-size: 56px; } .count > span { font-size: 14px; } .live { font-size: 11px; } .live::before { width: 8px; height: 8px; }
      .grid { grid-template-columns: 1fr; gap: 14px; }
      .card { padding: 18px 16px; border-radius: 18px; } .card h2 { font-size: 12px; margin-bottom: 14px; }
      .hero b { font-size: 72px; } .hero span { font-size: 15px; }
      .stack { height: 24px; margin: 16px 0 14px; border-radius: 8px; }
      .levels { gap: 10px; } .lv { font-size: 14px; grid-template-columns: 12px 22px 1fr auto; gap: 8px; } .lv .sw { width: 12px; height: 12px; } .lv .ic { width: 22px; height: 22px; } .lv b { font-size: 17px; }
      .bars { gap: 12px; } .bar { grid-template-columns: 26px 1fr auto; gap: 4px 10px; }
      .bar .ic { width: 26px; height: 26px; } .bar .lb { font-size: 14px; } .bar .pc { font-size: 17px; min-width: 46px; } .bar .tr { height: 8px; }
      .tiles { gap: 6px; } .tile { padding: 14px 10px; border-radius: 12px; } .tile .ic { width: 26px; height: 26px; } .tile .pc { font-size: 20px; } .tile .lb { font-size: 12px; }
      .profile { padding: 16px; border-radius: 18px; gap: 12px; } .profile .ic { width: 44px; height: 44px; } .profile small { font-size: 11px; } .profile p { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <header>
      <div>
        <h1>Come usate <em>l’AI</em></h1>
      </div>
      <div class="count" id="count"><b id="n">0</b><span>risposte<br><span class="live">in diretta</span></span></div>
    </header>

    <div class="grid">
      <section class="card"><h2>Quanto spesso</h2>
        <div class="hero"><b id="daily">0%</b><span>la usa<br><em>ogni giorno</em></span></div>
        <div class="stack" id="stack"></div>
        <div class="levels" id="levels"></div>
      </section>
      <section class="card"><h2>Con quali strumenti</h2><div class="bars" id="tools"></div></section>
      <section class="card"><h2>Per fare cosa</h2><div class="tiles" id="uses"></div></section>
    </div>

    <div class="profile"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg></span><div><small>Lo spettatore tipo di stasera</small><p id="profile">…</p></div></div>
  </div>

  <div class="wait" id="wait"><div><b>In attesa delle prime risposte…</b><span>Inquadrate il QR e rispondete dal telefono</span></div></div>

  <div id="nav-dots"></div>
  <a class="nav-arrow" id="nav-prev" href="#">&#8592;</a>
  <a class="nav-arrow" id="nav-next" href="#">&#8594;</a>

  <script src="js/common.js"></script>
  <script src="js/sns-config.js"></script>
  <script src="js/questionario.js?v=2"></script>
  <script>
    const Q = QZ.Q, $ = id => document.getElementById(id);
    const COLORS = ['#3a4357', '#2f6fb0', '#2f9cf0', '#5cc3ff', '#41e0ff'];
    const pct = (v, n) => n ? Math.round(v * 100 / n) : 0;
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const topKey = obj => Object.keys(obj).sort((a, b) => obj[b] - obj[a])[0];

    const icon = (k, o) => `<span class="ic">${QZ.icon(k, o[0])}</span>`;

    // frasi per l'identikit
    const FREQ_TXT = { mai: 'non usa ancora l’AI', mese: 'usa l’AI <b>qualche volta al mese</b>', settimana: 'usa l’AI <b>ogni settimana</b>',
                       giorno: 'usa l’AI <b>ogni giorno</b>', sempre: '<b>non può più fare a meno</b> dell’AI' };
    const USO_TXT = { info: 'cercare informazioni', scrivere: 'scrivere e correggere testi', lavoro: 'lavoro', studio: 'studiare', tradurre: 'tradurre',
                      immagini: 'creare immagini e video', codice: 'programmare', consigli: 'chiedere consigli', svago: 'svago e curiosità' };

    // struttura fissa; ogni giro aggiorna solo numeri e misure
    Q.frequenza.opts.forEach((o, i) => {
      const s = document.createElement('div'); s.style.background = COLORS[i]; s.id = 'st-' + o[0]; $('stack').appendChild(s);
      const l = document.createElement('div'); l.className = 'lv'; l.style.setProperty('--c', COLORS[i]);
      l.innerHTML = `<i class="sw"></i>${icon('frequenza', o)}<span>${o[1]}</span><b id="lv-${o[0]}">0%</b>`; $('levels').appendChild(l);
    });
    Q.strumenti.opts.forEach(o => { const d = document.createElement('div'); d.className = 'bar'; d.id = 'to-' + o[0];
      d.innerHTML = `${icon('strumenti', o)}<span class="lb">${esc(o[1])}</span><span class="pc">0%</span><div class="tr"><div></div></div>`; $('tools').appendChild(d); });
    Q.usi.opts.forEach(o => { const t = document.createElement('div'); t.className = 'tile'; t.id = 'us-' + o[0];
      t.innerHTML = `<div class="fill"></div><span>${icon('usi', o)}<span class="pc">0%</span></span><div class="lb">${esc(o[1])}</div>`; $('uses').appendChild(t); });

    function countTo(el, to, suffix) {
      const from = +(el.dataset.v || 0); el.dataset.v = to; if (from === to) { el.textContent = to + suffix; return; }
      const t0 = performance.now();
      (function step(t) { const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3);
        el.textContent = Math.round(from + (to - from) * e) + suffix; if (k < 1) requestAnimationFrame(step); })(t0);
    }

    let lastN = -1;
    function render(a) {
      const n = a.n;
      $('wait').classList.toggle('on', n === 0);
      countTo($('n'), n, '');
      if (lastN >= 0 && n !== lastN) { $('count').classList.remove('bump'); void $('count').offsetWidth; $('count').classList.add('bump'); }
      lastN = n;

      countTo($('daily'), pct(a.frequenza.giorno + a.frequenza.sempre, n), '%');
      Q.frequenza.opts.forEach(o => { $('st-' + o[0]).style.flexGrow = a.frequenza[o[0]]; $('lv-' + o[0]).textContent = pct(a.frequenza[o[0]], n) + '%'; });

      // strumenti in classifica (percentuale di chi ha risposto)
      const tools = Object.keys(a.strumenti).sort((x, y) => a.strumenti[y] - a.strumenti[x]), tMax = Math.max(1, a.strumenti[tools[0]]);
      tools.forEach((k, i) => { const d = $('to-' + k); d.style.order = i; d.classList.toggle('first', n > 0 && i === 0);
        d.querySelector('.pc').textContent = pct(a.strumenti[k], n) + '%'; d.querySelector('.tr div').style.width = (a.strumenti[k] * 100 / tMax) + '%'; });

      const uMax = Math.max(1, ...Object.values(a.usi)), uTop = topKey(a.usi);
      Q.usi.opts.forEach(o => { const t = $('us-' + o[0]), v = a.usi[o[0]];
        t.querySelector('.pc').textContent = pct(v, n) + '%'; t.querySelector('.fill').style.height = (v * 100 / uMax) + '%';
        t.classList.toggle('top', n > 0 && o[0] === uTop); });

      if (!n) { $('profile').textContent = 'si sta ancora formando…'; return; }
      const f = topKey(a.frequenza), t = topKey(a.strumenti), tLabel = Q.strumenti.opts.find(o => o[0] === t)[1];
      const usesTxt = ['nessuno', 'altro'].includes(t) ? '' : `, soprattutto <b>${esc(tLabel)}</b>`;
      $('profile').innerHTML = `${FREQ_TXT[f]}${f === 'mai' ? '' : usesTxt + `, per <b>${USO_TXT[uTop]}</b>`}.`;
    }

    // dal database ogni 4 secondi (fase «pre»), oppure finti con ?demo=1
    const DEMO = new URLSearchParams(location.search).has('demo');
    let demo = DEMO ? QZ.demoRows(40) : null;
    async function tick() {
      try {
        if (DEMO) { if (demo.length < 160) demo = demo.concat(QZ.demoRows(6)); render(QZ.aggregate(demo)); }
        else render(QZ.aggregate(await QZ.fetchAll('pre')));
      } catch (e) { /* rete assente: si riprova al giro dopo */ }
    }
    tick(); setInterval(tick, 4000);
    initNav();
  </script>
</body>
</html>
