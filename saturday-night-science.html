<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The AI Era — CICAP Fest</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root { --accent: #41b7ff; --accent-soft: #8fd2ff; --accent-deep: #1f7fd1; --ease: cubic-bezier(0.16,1,0.3,1); }
    html, body { background: #02040b !important; overflow: hidden; height: 100%; margin: 0; }
    body { font-family: inherit; }

    .stage {
      position: fixed; inset: 0; overflow: hidden;
      background:
        radial-gradient(80% 55% at 50% 110%, rgba(31,127,209,0.20), transparent 70%),
        radial-gradient(60% 50% at 50% -10%, rgba(65,183,255,0.14), transparent 70%),
        #02040b;
    }

    /* ---------- Rete neurale a strati, attraversata da segnali ---------- */
    #sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
      animation: fade 2.4s ease both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    /* scuro al centro per far respirare il titolo */
    .scrim {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(50% 42% at 50% 44%, rgba(2,4,11,0.86) 0%, rgba(2,4,11,0.5) 55%, rgba(2,4,11,0) 100%);
    }
    .vignette {
      position: absolute; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 260px 80px rgba(0,0,0,0.75);
    }

    /* ---------- Titolo ---------- */
    .content {
      position: absolute; inset: 0; z-index: 3;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 0 clamp(16px, 4vw, 60px);
      padding-bottom: clamp(150px, 26vh, 300px);
    }
    .title { position: relative; margin: 0; line-height: 0.86; }
    .title .l1, .title .l2 { display: block; white-space: nowrap; }
    .title .l1 {
      font-size: clamp(30px, 4.6vw, 84px);
      font-weight: 300; letter-spacing: 0.42em; margin-right: -0.42em;
    }
    .title .l2 {
      font-size: clamp(84px, 15vw, 280px);
      font-weight: 900; letter-spacing: -0.03em;
      margin-top: clamp(4px, 1vh, 14px);
    }
    .ch { display: inline-block; will-change: transform, filter, opacity; }
    .ch.sp { width: 0.28em; }
    .l1 .ch {
      color: var(--accent-soft);
      filter: blur(0) drop-shadow(0 0 22px rgba(65,183,255,0.5));
      animation: chIn1 1s var(--ease) both;
    }
    .l2 .ch {
      background: linear-gradient(180deg, #ffffff 32%, #cfe9ff 70%, var(--accent) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: blur(0) drop-shadow(0 0 50px rgba(65,183,255,0.35));
      animation: chIn2 1.1s var(--ease) both;
    }
    @keyframes chIn1 {
      from { opacity: 0; transform: translateY(-0.6em); filter: blur(14px) drop-shadow(0 0 22px rgba(65,183,255,0)); }
      to   { opacity: 1; transform: none;               filter: blur(0)    drop-shadow(0 0 22px rgba(65,183,255,0.5)); }
    }
    @keyframes chIn2 {
      0%   { opacity: 0; transform: translateY(0.35em) scale(1.35); filter: blur(24px) drop-shadow(0 0 50px rgba(65,183,255,0)); }
      60%  { opacity: 1; }
      100% { opacity: 1; transform: none;                        filter: blur(0)    drop-shadow(0 0 50px rgba(65,183,255,0.35)); }
    }

    /* lama di luce che attraversa il titolo (overlay: sul fondo scuro non si vede) */
    .shine {
      position: absolute; inset: -10% -6%; pointer-events: none; mix-blend-mode: overlay;
      background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,0.0) 42%, rgba(255,255,255,0.95) 50%, rgba(255,255,255,0) 58%, transparent 62%);
      background-size: 260% 100%; background-position: 130% 0;
      animation: shine 8s 3.6s ease-in-out infinite;
    }
    @keyframes shine {
      0%   { background-position: 130% 0; }
      22%  { background-position: -30% 0; }
      100% { background-position: -30% 0; }
    }

    /* linea di scansione all'ingresso */
    .scan {
      position: absolute; left: -8%; right: -8%; top: 0; height: 2px; pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(143,210,255,0.9), transparent);
      box-shadow: 0 0 18px 4px rgba(65,183,255,0.55);
      opacity: 0; animation: scan 1.5s 0.45s cubic-bezier(0.65,0,0.35,1) both;
    }
    @keyframes scan {
      0%   { opacity: 0; transform: translateY(0); }
      12%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(var(--scan-h, 300px)); }
    }

    .divider {
      position: relative; width: min(560px, 62vw); height: 1px;
      margin: clamp(22px, 3.6vh, 40px) auto clamp(18px, 2.8vh, 30px);
      background: linear-gradient(90deg, transparent, rgba(143,210,255,0.6), transparent);
      animation: grow 1.2s 1.5s var(--ease) both;
    }
    .divider::after {
      content: ''; position: absolute; left: 50%; top: 50%;
      width: 8px; height: 8px; border-radius: 50%;
      transform: translate(-50%, -50%);
      background: #fff; box-shadow: 0 0 14px 4px rgba(65,183,255,0.8);
      animation: pulse 2.6s 2.6s ease-in-out infinite;
    }
    @keyframes grow { from { opacity: 0; transform: scaleX(0.1); } to { opacity: 1; transform: scaleX(1); } }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

    .subtitle {
      font-size: clamp(22px, 2.5vw, 44px);
      font-weight: 300; color: #e6ecf5; letter-spacing: 0.01em;
      margin: 0; max-width: 28em; line-height: 1.3;
    }
    .subtitle .w { display: inline-block; animation: wIn 0.9s var(--ease) both; }
    .subtitle .w.b {
      font-weight: 700; color: #fff;
      text-shadow: 0 0 24px rgba(65,183,255,0.7);
    }
    @keyframes wIn {
      from { opacity: 0; transform: translateY(0.5em); filter: blur(8px); }
      to   { opacity: 1; transform: none;               filter: blur(0); }
    }

    /* ---------- Logo CICAP Fest ---------- */
    .logo {
      position: absolute; left: 50%; bottom: clamp(40px, 6.5vh, 80px); z-index: 3;
      height: clamp(110px, 19vh, 220px); aspect-ratio: 599 / 640;
      transform: translateX(-50%);
    }
    .logo .ring {
      position: absolute; left: 50%; top: 62%; width: 120%; aspect-ratio: 1;
      border-radius: 50%; border: 2px solid rgba(143,210,255,0.7);
      transform: translate(-50%, -50%) scale(0.2); opacity: 0;
      animation: ring 1.4s 2.75s var(--ease) both;
    }
    .logo .ring.r2 { animation-delay: 2.95s; border-color: rgba(65,183,255,0.45); }
    @keyframes ring {
      0%   { opacity: 0;   transform: translate(-50%, -50%) scale(0.2); }
      15%  { opacity: 1; }
      100% { opacity: 0;   transform: translate(-50%, -50%) scale(1.6); }
    }
    /* Niente filtri sull'immagine (Safari può disegnarla come un rettangolo pieno):
       il bagliore è un alone dietro, l'animazione solo spostamento e opacità. */
    .logo .glow {
      position: absolute; left: 50%; top: 55%; width: 150%; aspect-ratio: 1; border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
      background: radial-gradient(closest-side, rgba(65,183,255,0.32), rgba(65,183,255,0.10) 55%, transparent);
      opacity: 0; animation: fade 1.2s 2.7s ease both;
    }
    .logo .stamp { position: relative; width: 100%; height: 100%;
      animation: stamp 1.1s 2.5s cubic-bezier(0.34,1.56,0.64,1) both; }
    .logo .float { width: 100%; height: 100%; animation: float 6s 3.8s ease-in-out infinite; }
    .logo img { display: block; width: 100%; height: 100%; }
    @keyframes stamp {
      0%   { opacity: 0; transform: scale(0.55) rotate(-10deg); }
      55%  { opacity: 1; }
      100% { opacity: 1; transform: none; }
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    @media (max-aspect-ratio: 1/1) {
      .title .l1 { letter-spacing: 0.24em; margin-right: -0.24em; font-size: 7vw; }
      .title .l2 { font-size: 18vw; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .scan, .logo .ring { display: none; }
    }
  </style>
</head>
<body>

  <div class="stage">
    <canvas id="sky"></canvas>
    <div class="scrim"></div>
    <div class="vignette"></div>

    <div class="content">
      <h1 class="title" aria-label="The AI Era">
        <span class="l1" data-split="The" data-delay="0.2" data-step="0.09"></span>
        <span class="l2" data-split="AI Era" data-delay="0.5" data-step="0.075"></span>
        <span class="shine"></span>
        <span class="scan"></span>
      </h1>
      <div class="divider"></div>
      <p class="subtitle" id="subtitle"></p>
    </div>

    <div class="logo">
      <span class="glow"></span><span class="ring"></span><span class="ring r2"></span>
      <div class="stamp"><div class="float"><img src="img/loghi/cicap-fest-negativo.png" alt="CICAP Fest" /></div></div>
    </div>
  </div>

  <div id="nav-dots"></div>
  <a class="nav-arrow" id="nav-prev" href="#">&#8592;</a>
  <a class="nav-arrow" id="nav-next" href="index.html">&#8594;</a>

  <div id="lang-toggle">
    <button class="lang-btn" data-lang="it">IT</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>

  <script src="js/common.js"></script>
  <script src="js/rete-neurale.js"></script>
  <script>
    // Titolo lettera per lettera, con ritardi scalati
    document.querySelectorAll('[data-split]').forEach(el => {
      const d0 = parseFloat(el.dataset.delay), step = parseFloat(el.dataset.step);
      [...el.dataset.split.toUpperCase()].forEach((c, i) => {
        const s = document.createElement('span');
        s.className = 'ch' + (c === ' ' ? ' sp' : '');
        s.setAttribute('aria-hidden', 'true');
        s.textContent = c === ' ' ? '' : c;
        s.style.animationDelay = (d0 + i * step).toFixed(3) + 's';
        el.appendChild(s);
      });
    });
    // la scansione percorre tutta l'altezza del titolo
    const title = document.querySelector('.title');
    const setScan = () => title.style.setProperty('--scan-h', title.offsetHeight + 'px');
    setScan(); addEventListener('resize', setScan);

    // Sottotitolo: parole in sequenza, la seconda parte in evidenza
    const TXT = {
      it: [["Chi controlla l'intelligenza artificiale", false], ['controlla il futuro.', true]],
      en: [['Whoever controls artificial intelligence', false], ['controls the future.', true]]
    };
    function renderTexts() {
      const sub = document.getElementById('subtitle');
      sub.textContent = '';
      let i = 0;
      TXT[lang].forEach(([text, bold], k) => {
        text.split(' ').forEach((word, j, arr) => {
          const s = document.createElement('span');
          s.className = 'w' + (bold ? ' b' : '');
          s.textContent = word;
          s.style.animationDelay = (1.75 + i++ * 0.07).toFixed(2) + 's';
          if (sub.childNodes.length) sub.appendChild(document.createTextNode(' '));   // spazio vero: si va a capo
          sub.appendChild(s);
        });
      });
    }
    function onLangChange() { renderTexts(); }

    initLangToggle();
    renderTexts();
    initNav();

    startNeuralNet(document.getElementById('sky'));
  </script>
</body>
</html>
