<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Show — The AI Era</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #f0f5fb;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    body.idle { cursor: none; }

    .layer { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000;
      opacity: 0; visibility: hidden; transition: opacity .7s ease, visibility 0s linear .7s; }
    .layer.on { opacity: 1; visibility: visible; transition: opacity .7s ease, visibility 0s; z-index: 2; }
    video.layer { object-fit: contain; }

    /* Avvio: serve un clic per lo schermo intero e per l'audio dei video */
    #start { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; cursor: pointer;
      background: radial-gradient(60% 50% at 50% 50%, rgba(65,183,255,0.10), transparent 70%), rgba(2,4,11,0.92);
      transition: opacity .5s ease; }
    #start.gone { opacity: 0; pointer-events: none; }
    #start .btn { width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(65,183,255,0.6);
      background: rgba(65,183,255,0.16); box-shadow: 0 0 50px rgba(65,183,255,0.25);
      display: flex; align-items: center; justify-content: center; }
    #start .btn::before { content: ''; border-left: 38px solid rgba(255,255,255,0.95);
      border-top: 24px solid transparent; border-bottom: 24px solid transparent; margin-left: 10px; }
    #start p { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: #8fd2ff; }
    #start small { font-size: 13px; color: rgba(240,245,251,0.5); }

    /* Audio bloccato dal browser: il video parte muto, un clic lo riattiva */
    #sound { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 45;
      padding: 12px 20px; border-radius: 999px; border: 1px solid rgba(65,183,255,0.5);
      background: rgba(2,4,11,0.85); color: #dff2ff; font-size: 15px; cursor: pointer;
      display: none; }
    #sound.show { display: block; }

    /* Avvio del video bloccato del tutto (Safari, risparmio energetico): serve un tocco */
    #tap { position: fixed; inset: 0; z-index: 48; display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; cursor: pointer; background: rgba(2,4,11,0.55); }
    #tap.show { display: flex; }
    #tap .btn { width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(65,183,255,0.7);
      background: rgba(65,183,255,0.2); display: flex; align-items: center; justify-content: center; }
    #tap .btn::before { content: ''; border-left: 38px solid #fff; border-top: 24px solid transparent;
      border-bottom: 24px solid transparent; margin-left: 10px; }
    #tap p { font-size: 16px; letter-spacing: .12em; text-transform: uppercase; color: #dff2ff; }

    /* Suoni dalla console: pulsante discreto in basso a sinistra (o tasto A) */
    #out-btn { position: fixed; left: 12px; bottom: 12px; z-index: 46; padding: 8px 12px; border-radius: 10px;
      border: 1px solid rgba(143,210,255,0.3); background: rgba(2,4,11,0.8); color: #cfe9ff; font-size: 13px;
      cursor: pointer; opacity: 0; transition: opacity .3s; }
    body:not(.idle) #out-btn { opacity: .85; }
    #out-panel { position: fixed; left: 12px; bottom: 56px; z-index: 47; width: min(420px, calc(100vw - 24px));
      padding: 16px; border-radius: 14px; border: 1px solid rgba(65,183,255,0.45); background: rgba(3,8,18,0.96);
      color: #e6ecf5; font-size: 14px; display: none; }
    #out-panel.show { display: block; }
    #out-panel h4 { margin: 0 0 10px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #8fd2ff; }
    #snd-list .snd { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    #snd-list .snd span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #snd-list .snd small { color: rgba(230,236,245,0.6); }
    #snd-list label { flex: none; padding: 8px 12px; border-radius: 10px; background: #0d1a2c; border: 1px solid rgba(143,210,255,0.25); cursor: pointer; }
    #out-panel p { margin: 10px 0 0; color: rgba(230,236,245,0.6); font-size: 13px; line-height: 1.4; }

    /* Pallino discreto: collegamento con la console */
    #link { position: fixed; top: 10px; right: 10px; z-index: 40; width: 8px; height: 8px; border-radius: 50%;
      background: #34d399; opacity: 0; transition: opacity .4s; pointer-events: none; }
    body:not(.idle) #link.show { opacity: .7; }

    /* Console in sovrimpressione (tasto C): lo show resta sotto, a schermo intero */
    #console-layer { position: fixed; inset: 0; z-index: 60; border: 0; width: 100%; height: 100%; background: #070b14;
      opacity: 0; visibility: hidden; transform: scale(0.985); transition: opacity .25s ease, transform .25s ease, visibility 0s .25s; }
    #console-layer.on { opacity: 1; visibility: visible; transform: none; transition: opacity .25s ease, transform .25s ease, visibility 0s; }
  </style>
</head>
<body>
  <iframe class="layer" id="frame-a" title="Slide"></iframe>
  <iframe class="layer" id="frame-b" title="Slide"></iframe>
  <video class="layer" id="vid" playsinline preload="auto"></video>

  <div id="start" role="button" tabindex="0">
    <div class="btn"></div>
    <p>Avvia a tutto schermo</p>
    <small>Frecce / telecomando per le slide · F schermo intero · C apre e chiude la console</small>
  </div>
  <div id="link" title="Console collegata"></div>
  <button id="out-btn" title="Suoni (A)">Suoni</button>
  <div id="out-panel">
    <h4>Suoni dalla console</h4>
    <div id="snd-list"></div>
  </div>
  <div id="sound" role="button">Audio disattivato dal browser — tocca lo schermo per attivarlo</div>
  <div id="tap" role="button"><div class="btn"></div><p>Tocca per avviare il video</p></div>
  <iframe id="console-layer" title="Console"></iframe>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script src="js/sns-config.js"></script>
  <script src="js/film-quiz-data.js"></script>
  <script src="js/sns.js"></script>
  <script>
    const frames = [document.getElementById('frame-a'), document.getElementById('frame-b')];
    const vid = document.getElementById('vid');
    // Voce delle slide con «audio»: la suona lo show (sbloccata al primo tocco
    // come i video) e manda il tempo alla slide, che mostra le didascalie.
    const voice = new Audio(); voice.preload = 'auto';
    let voiceSlide = null;
    let front = 0;                 // iframe visibile
    let current = null;            // id dell'elemento in onda
    let slideIdx = 0;              // posizione nella scaletta dell'ultima slide mostrata

    // Ordine delle slide: lo decide la console (trascinando le schede) e lo
    // show lo ricorda in questo browser.
    const ORDER_KEY = 'sns-show-order-2',   // -2: ordine del 31/10 sera
          DELETED_KEY = 'sns-show-deleted';
    let order = SNS.SLIDES.slice();
    let deleted = [];               // slide eliminate dalla console: fuori dalla sequenza
    try { const d = JSON.parse(localStorage.getItem(DELETED_KEY)); if (Array.isArray(d)) deleted = d; } catch (_) {}
    let orderRev = 0;               // quando è stata fatta l'ultima modifica in console: vince la più recente
    function setOrder(ids, del, rev) {
      if (!Array.isArray(ids)) return false;
      if (rev) orderRev = Math.max(orderRev, +rev || 0);
      if (Array.isArray(del)) {
        deleted = del;
        try { localStorage.setItem(DELETED_KEY, JSON.stringify(deleted)); } catch (_) {}
      }
      const byId = new Map(SNS.SLIDES.map(x => [x.id, x]));
      const next = SNS.normalize(ids, deleted).map(id => byId.get(id));     // slide nuove al loro posto
      if (!next.length) return false;
      const changed = next.some((x, i) => x !== order[i]);
      order = next;
      const cur = order.findIndex(x => x.id === current);
      if (cur >= 0) slideIdx = cur;
      try { localStorage.setItem(ORDER_KEY, JSON.stringify({ base: SNS.ORDER_BASE, ids: order.map(x => x.id), rev: orderRev })); } catch (_) {}
      return changed;
    }
    try {                                     // resta valido anche se la scaletta predefinita cambia
      const saved = JSON.parse(localStorage.getItem(ORDER_KEY));
      if (saved && Array.isArray(saved.ids)) setOrder(saved.ids, undefined, saved.rev);
    } catch (_) {}
    let videoURL = null;
    let lang = localStorage.getItem('geopolitica-lang') || 'it';
    let loadToken = 0;

    function state() {
      const m = voiceSlide ? voice : vid, media = !!voiceSlide || !!(current && current.startsWith('video:'));
      return { t: 'state', id: current, lang, media,
        playing: media ? !m.paused && !m.ended : false,
        time: m.currentTime || 0, dur: isFinite(m.duration) ? m.duration : 0,
        fs: !!document.fullscreenElement, order: order.map(x => x.id), base: SNS.ORDER_BASE, rev: orderRev, deleted, blocked: tap.classList.contains('show'), muted: vid.muted, sound: soundNow, sounds: soundsLoaded, at: Date.now() };
    }
    function report(local) { SNS.send(state(), local); }

    function stopVideo() {
      stopVoice();
      vid.pause();
      vid.classList.remove('on');
      sound.classList.remove('show');
      tap.classList.remove('show');
    }

    function showSlide(i) {
      if (i < 0 || i >= order.length) return;
      const s = order[i];
      slideIdx = i;
      if (current === s.id) return;
      if (s.video) { showVideo(s.id); return; }      // video dentro la sequenza
      current = s.id;
      const token = ++loadToken;
      const back = frames[1 - front];
      back.onload = () => {
        if (token !== loadToken) return;
        try { back.contentWindow.postMessage({ type: 'op-setlang', lang }, '*'); } catch (_) {}
        if (s.audio) try { back.contentWindow.postMessage({ type: 'op-audio-host' }, '*'); } catch (_) {}
        setTimeout(() => {
          if (token !== loadToken) return;
          back.classList.add('on');
          frames[front].classList.remove('on');
          stopVideo();
          front = 1 - front;
          if (s.audio) startVoice(s);
          // libera la slide precedente quando la dissolvenza è finita
          const old = frames[1 - front];
          setTimeout(() => { if (token === loadToken && !old.classList.contains('on')) old.removeAttribute('src'); }, 800);
        }, 80);
      };
      back.src = s.src;
      report();
    }

    function showVideo(id) {
      const hosted = SNS.VIDEOS.find(v => v.id === id);
      (hosted ? Promise.resolve(hosted) : SNS.videos.get(id)).then(v => {
        if (!v) return;
        ++loadToken;
        stopVoice();
        current = id;
        if (videoURL) { URL.revokeObjectURL(videoURL); videoURL = null; }
        if (v.blob) videoURL = URL.createObjectURL(v.blob);
        vid.src = videoURL || v.src;
        vid.muted = false;
        vid.classList.add('on');
        frames.forEach(f => f.classList.remove('on'));
        playVideo();
        report();
      });
    }

    // Senza un tocco sullo show il browser può bloccare l'audio: in quel caso il
    // video parte muto con l'invito a riattivarlo. Safari può bloccare anche il
    // video muto: allora compare un grande pulsante da toccare.
    const sound = document.getElementById('sound');
    const tap = document.getElementById('tap');
    function playVideo() {
      tap.classList.remove('show');
      vid.play().then(() => { if (!vid.muted) sound.classList.remove('show'); }).catch(() => {
        vid.muted = true;
        vid.play().then(() => { sound.classList.add('show'); report(); }).catch(() => { tap.classList.add('show'); report(); });
      });
    }
    function startVoice(s) {
      voiceSlide = s;
      if (voice.getAttribute('src') !== s.audio) voice.src = s.audio;
      voice.muted = false;
      try { voice.currentTime = 0; } catch (_) {}
      playVoice();
    }
    function playVoice() {
      tap.classList.remove('show');
      voice.play().then(() => { syncVoice(); report(); }).catch(() => { tap.classList.add('show'); syncVoice(); report(); });
    }
    function stopVoice() {
      if (!voiceSlide) return;
      voiceSlide = null;
      voice.pause();
    }
    // il tempo della voce alla slide in onda, che ci appoggia le didascalie
    function syncVoice() {
      if (!voiceSlide) return;
      try { frames[front].contentWindow.postMessage({ type: 'op-audio', t: voice.currentTime, playing: !voice.paused && !voice.ended }, '*'); } catch (_) {}
    }
    ['play', 'pause', 'seeked', 'ended', 'timeupdate'].forEach(ev => voice.addEventListener(ev, syncVoice));
    ['play', 'pause', 'ended', 'loadedmetadata'].forEach(ev => voice.addEventListener(ev, () => report()));
    setInterval(syncVoice, 500);

    function unmute() {
      if (voiceSlide && voice.paused && !voice.ended) { playVoice(); return; }
      tap.classList.remove('show');
      if (vid.muted) { vid.muted = false; sound.classList.remove('show'); report(); }
      if (current && current.startsWith('video:') && vid.paused) playVideo();
    }
    tap.addEventListener('click', e => { e.stopPropagation(); unmute(); });

    // Al primo tocco sulla pagina «sblocca» l'elemento video, con l'audio: per
    // Safari un play() non muto nato da un gesto vale anche per i video lanciati
    // dopo dalla console. play() e pause() nello stesso istante: non si sente nulla.
    let unlocked = false;
    function unlockMedia() {
      if (unlocked) return;
      unlocked = true;
      // anche la voce: senza questo Safari la blocca quando parte dalla console
      if (voiceSlide) playVoice();
      else {
        const a = SNS.SLIDES.find(x => x.audio);
        if (a && !voice.getAttribute('src')) voice.src = a.audio;
        const pv = voice.play(); voice.pause(); if (pv) pv.catch(() => {});
      }
      if (current && current.startsWith('video:')) { unmute(); return; }
      if (!vid.getAttribute('src') && SNS.VIDEOS.length) vid.src = SNS.VIDEOS[0].src;
      vid.muted = false;
      const p = vid.play();
      vid.pause();
      if (p) p.catch(() => {});
    }
    ['pointerdown', 'keydown', 'touchend'].forEach(ev => document.addEventListener(ev, unlockMedia, true));
    // Video partito muto: qualunque tocco sullo show riattiva l'audio
    document.addEventListener('pointerdown', () => {
      if (unlocked && vid.muted && current && current.startsWith('video:')) unmute();
    }, true);
    sound.addEventListener('click', e => { e.stopPropagation(); unmute(); });

    function go(id) {
      const i = order.findIndex(s => s.id === id);
      if (i >= 0) showSlide(i);
      else if (id && id.startsWith('video:')) showVideo(id);
    }
    // Una slide può rivelare i suoi elementi un passo alla volta: se espone
    // window.__snsStep(dir) e restituisce true, il comando resta a lei.
    function slideStep(dir) {
      if (!current || current.startsWith('video:')) return false;
      try { const w = frames[front].contentWindow; return !!(w && typeof w.__snsStep === 'function' && w.__snsStep(dir)); }
      catch (_) { return false; }
    }
    function next() {
      if (slideStep('next')) return;
      if (current && current.startsWith('video:')) showSlide(Math.min(slideIdx + 1, order.length - 1));
      else showSlide(slideIdx + 1);
    }
    function prev() {
      if (slideStep('prev')) return;
      // video lanciato dalla galleria: si torna alla slide di prima;
      // video della sequenza: si torna all'elemento che lo precede
      if (current && current.startsWith('video:') && !(order[slideIdx] && order[slideIdx].id === current)) showSlide(slideIdx);
      else showSlide(slideIdx - 1);
    }

    function setLang(l) {
      if (l !== 'it' && l !== 'en') return;
      lang = l;
      try { localStorage.setItem('geopolitica-lang', l); } catch (_) {}
      frames.forEach(f => { try { f.contentWindow.postMessage({ type: 'op-setlang', lang: l }, '*'); } catch (_) {} });
      report();
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else document.documentElement.requestFullscreen().catch(() => {});
    }

    // ── Avvio ──
    const start = document.getElementById('start');
    function begin() {
      if (start.classList.contains('gone')) return;
      start.classList.add('gone');
      document.documentElement.requestFullscreen().catch(() => {});
      unmute();
      if (current && current.startsWith('video:') && vid.paused) playVideo();
    }
    start.addEventListener('click', begin);

    // ── Tastiera / telecomando ──
    // ── Console dentro lo show (C): si apre sopra le slide e si richiude con C, Esc o il pulsante ──
    const consoleLayer = document.getElementById('console-layer');
    function toggleConsole(open) {
      const on = open === undefined ? !consoleLayer.classList.contains('on') : open;
      if (on && !consoleLayer.getAttribute('src')) consoleLayer.src = 'sns-console.html?embed=1';
      consoleLayer.classList.toggle('on', on);
      if (on) setTimeout(() => { try { consoleLayer.contentWindow.focus(); } catch (_) {} }, 50);
      else { consoleLayer.blur(); window.focus(); }
    }

    document.addEventListener('keydown', e => {
      if ((e.key === 'c' || e.key === 'C') && !e.metaKey && !e.ctrlKey && !e.altKey) { toggleConsole(); return; }
      if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); return; }
      if (e.key === 'a' || e.key === 'A') { outPanel.classList.toggle('show'); return; }
      if (!start.classList.contains('gone') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); begin(); return; }
      if ((e.key === 'k' || e.key === 'K') && voiceSlide) { voice.paused ? playVoice() : voice.pause(); return; }
      if ((e.key === 'k' || e.key === 'K') && current && current.startsWith('video:')) {
        vid.paused ? playVideo() : vid.pause(); return;
      }
      if (SNS.isNext(e)) { e.preventDefault(); next(); }
      else if (SNS.isPrev(e)) { e.preventDefault(); prev(); }
    });
    // Le slide nell'iframe inoltrano qui i tasti (js/common.js, initEmbed)
    window.addEventListener('message', e => {
      const d = e.data || {};
      if (d.type === 'op-nav') d.dir === 'next' ? next() : prev();
      else if (d.type === 'sns-console') toggleConsole(d.op === 'close' ? false : d.op === 'open' ? true : undefined);
    });

    // ── Comandi dalla console ──
    const link = document.getElementById('link');
    let linkTimer = null;
    SNS.listen(m => {
      link.classList.add('show');
      clearTimeout(linkTimer);
      linkTimer = setTimeout(() => link.classList.remove('show'), 6000);
      // Un comando della console toglie il riquadro d'avvio, che altrimenti
      // coprirebbe slide e video (lo schermo intero resta da attivare con F o un clic).
      if (m.t === 'go' || m.t === 'next' || m.t === 'prev' || m.t === 'video') start.classList.add('gone');
      switch (m.t) {
        case 'go': go(m.id); break;
        case 'next': next(); break;
        case 'prev': prev(); break;
        case 'lang': setLang(m.lang); break;
        case 'video':
          if (voiceSlide) {                         // stessi comandi per la voce di una slide
            if (m.op === 'play') playVoice();
            else if (m.op === 'pause') voice.pause();
            else if (m.op === 'restart') { voice.currentTime = 0; playVoice(); }
            else if (m.op === 'seek' && isFinite(m.time)) voice.currentTime = m.time;
            break;
          }
          if (!current || !current.startsWith('video:')) break;
          if (m.op === 'play') playVideo();
          else if (m.op === 'pause') vid.pause();
          else if (m.op === 'restart') { vid.currentTime = 0; playVideo(); }
          else if (m.op === 'seek' && isFinite(m.time)) vid.currentTime = m.time;
          break;
        case 'order':                          // una scaletta più vecchia di quella in onda non la sostituisce
          if (m.rev && +m.rev < orderRev) report();
          else if (setOrder(m.ids, m.deleted, m.rev) || m.rev) report();
          break;
        case 'sound': toggleSound(m.id, m.op); break;
        case 'hello': report(!m.net); break;   // risponde sullo stesso canale del ping
      }
    });

    let lastTick = 0;
    vid.addEventListener('timeupdate', () => { const n = Date.now(); if (n - lastTick > 900) { lastTick = n; report(true); } });
    ['play', 'pause', 'ended', 'loadedmetadata', 'seeked'].forEach(ev => vid.addEventListener(ev, () => report()));
    document.addEventListener('fullscreenchange', () => report());

    // Cursore nascosto dopo 2 s di inattività
    let idleTimer = null;
    function wake() { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add('idle'), 2000); }
    document.addEventListener('mousemove', wake);
    wake();

    // ── Suoni lanciati dalla console (es. Star Wars). Il file si carica qui,
    //    nel pannello dei suoni, e resta in questo browser. ──
    const snd = new Audio(); snd.preload = 'auto';
    let soundNow = null, soundsLoaded = [], soundURL = null, fadeTimer = null, cutTimer = null;
    function refreshSounds() {
      return SNS.sounds.list().then(list => {
        soundsLoaded = list.map(x => x.id);
        const box = document.getElementById('snd-list'); box.textContent = '';
        SNS.SOUNDS.forEach(def => {
          const got = list.find(x => x.id === def.id);
          const row = document.createElement('div'); row.className = 'snd';
          row.innerHTML = '<span></span><label>Carica brano…<input type="file" accept="audio/*" hidden></label>';
          row.querySelector('span').innerHTML = '';
          row.querySelector('span').append(def.title + ' ', Object.assign(document.createElement('small'), { textContent: got ? '· ' + got.name : '· non caricato' }));
          row.querySelector('input').addEventListener('change', e => {
            const f = e.target.files[0]; if (!f) return;
            SNS.sounds.put(def.id, f).then(refreshSounds).then(() => report());
          });
          box.appendChild(row);
        });
      }).catch(() => {});
    }
    function stopSound(now) {
      clearInterval(fadeTimer); clearTimeout(cutTimer);
      if (now || snd.paused) { snd.pause(); soundNow = null; report(); return; }
      fadeTimer = setInterval(() => {                      // dissolvenza di 1,2 s
        snd.volume = Math.max(0, snd.volume - 0.08);
        if (snd.volume <= 0) { clearInterval(fadeTimer); snd.pause(); soundNow = null; report(); }
      }, 100);
    }
    function toggleSound(id, op) {
      if (soundNow === id && !snd.paused) { stopSound(); return; }
      if (op === 'stop') return;
      SNS.sounds.get(id).then(rec => {
        if (!rec) { report(); return; }
        clearInterval(fadeTimer);
        if (soundURL) URL.revokeObjectURL(soundURL);
        soundURL = URL.createObjectURL(rec.blob);
        snd.src = soundURL; snd.volume = 1; snd.currentTime = 0;
        soundNow = id;
        snd.play().then(() => {
          report();
          // solo l'attacco del brano: dopo «max» secondi sfuma da solo
          const def = SNS.SOUNDS.find(x => x.id === id);
          clearTimeout(cutTimer);
          if (def && def.max) cutTimer = setTimeout(() => { if (soundNow === id) stopSound(); }, def.max * 1000);
        }).catch(() => { soundNow = null; tap.classList.add('show'); report(); });
      });
    }
    snd.addEventListener('ended', () => { soundNow = null; report(); });
    refreshSounds();

    // Un file audio trascinato sulla finestra dello show diventa il brano di Star Wars
    document.addEventListener('dragover', e => { if ([...e.dataTransfer.items].some(i => i.type.startsWith('audio/'))) e.preventDefault(); });
    document.addEventListener('drop', e => {
      const f = [...e.dataTransfer.files].find(x => x.type.startsWith('audio/') || /\.(mp3|m4a|wav|aac|ogg)$/i.test(x.name));
      if (!f || !SNS.SOUNDS.length) return;
      e.preventDefault();
      SNS.sounds.put(SNS.SOUNDS[0].id, f).then(refreshSounds).then(() => {
        report();
        const n = document.getElementById('sound');                    // conferma breve sullo show
        const old = n.textContent; n.textContent = 'Brano caricato per ' + SNS.SOUNDS[0].title + ': ' + f.name;
        n.classList.add('show'); setTimeout(() => { n.classList.remove('show'); n.textContent = old; }, 3500);
      });
    });

    // ── Pannello dei suoni (pulsante in basso a sinistra o tasto A) ──
    const outBtn = document.getElementById('out-btn'), outPanel = document.getElementById('out-panel');
    outBtn.addEventListener('click', e => { e.stopPropagation(); outPanel.classList.toggle('show'); });
    outPanel.addEventListener('pointerdown', e => e.stopPropagation());

    showSlide(0);
    SNS.send({ t: 'show-ready' });
  </script>
</body>
</html>
